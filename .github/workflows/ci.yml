name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - docker-deployment

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dependency security gate
        run: npm audit --audit-level=moderate

      - name: Security and feature regressions
        run: npm run test:core

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://localhost
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium firefox

      - name: Browser and transfer regressions
        env:
          BROWSER_CHANNEL: chromium
        run: |
          node scripts/create-preview-fixtures.mjs
          npm run test:ui
          node tests/file-trash.mjs
          node tests/mobile-auth.mjs
          node tests/temporary-share-hosting.mjs

      - name: Firefox public preview and consumption regressions
        env:
          BROWSER_ENGINE: firefox
        run: node scripts/run-ui-regressions.mjs public-previews public-consumption mobile-video-completion video-presentation

      - name: Email and reconciliation regressions
        run: |
          python -m pip install requests==2.32.5
          python tests/email-dispatcher.py
          python tests/storage-integrity.py
          python tests/production-diagnostics.py
          python tests/runtime-api-health.py
          sh -n scripts/backup-full.sh
          sh -n scripts/backup-database.sh
          sh -n scripts/deploy.sh
          sh -n docker/start-web.sh

      - name: Validate Docker image
        run: |
          docker build \
            --build-arg VITE_SUPABASE_URL=http://localhost \
            --build-arg VITE_SUPABASE_ANON_KEY=ci-placeholder-key \
            -t streamly-web:ci .

      - name: Validate serving configuration
        run: docker run --rm -e APP_ADDRESS=:80 -e SUPABASE_API_UPSTREAM=127.0.0.1:8000 --entrypoint caddy streamly-web:ci validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Serving and security-header regressions
        env:
          BROWSER_CHANNEL: chromium
        run: |
          docker create --name caddy-ci streamly-web:ci
          docker cp caddy-ci:/usr/bin/caddy .runtime/caddy-ci
          docker rm caddy-ci
          chmod 755 .runtime/caddy-ci
          CADDY_BIN="$PWD/.runtime/caddy-ci" node tests/serving-security.mjs
          CADDY_BIN="$PWD/.runtime/caddy-ci" node tests/public-preview-caching.mjs

      - name: Validate Compose configuration
        run: |
          docker compose --env-file .env.example -f compose.yml config --quiet
          node tests/deployment-compose.mjs

  media-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build isolated media decoder
        run: docker build -t streamly-media-validation:ci services/media-worker
      - name: Verify media decoding and publication
        run: |
          docker run --rm --network none --memory 2g --cpus 2 --entrypoint python streamly-media-validation:ci test_validation.py
          docker run --rm --network none --entrypoint python streamly-media-validation:ci test_worker.py
          docker run --rm --network none --entrypoint python streamly-media-validation:ci test_cleanup_receipts.py
