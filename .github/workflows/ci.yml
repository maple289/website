name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - docker-deployment

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://localhost
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key

      - name: Validate Docker image
        run: |
          docker build \
            --build-arg VITE_SUPABASE_URL=http://localhost \
            --build-arg VITE_SUPABASE_ANON_KEY=ci-placeholder-key \
            -t streamly-web:ci .

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example -f compose.yml config --quiet
