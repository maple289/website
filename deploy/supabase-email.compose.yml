# Backend-only environment. Never pass these values as frontend build arguments.
services:
  functions:
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-Streamly}
      SITE_URL: ${SITE_URL:-}
      SITE_NAME: ${SITE_NAME:-Streamly}
      CUSTOMER_EMAILS_ENABLED: ${CUSTOMER_EMAILS_ENABLED:-false}
      ADMIN_NOTIFICATION_RECIPIENTS: ${ADMIN_NOTIFICATION_RECIPIENTS:-}
