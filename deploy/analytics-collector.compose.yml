services:
  analytics-collector:
    image: ${ANALYTICS_COLLECTOR_IMAGE:-supabase-analytics-collector}
    build:
      context: ${STREAMLY_PROJECT_ROOT:?Set the absolute project checkout path}/services/analytics-collector
    restart: unless-stopped
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET}
      TENANT_ID: ${STORAGE_TENANT_ID}
      ANALYTICS_STORAGE_INTERVAL: ${ANALYTICS_STORAGE_INTERVAL:-600}
    volumes:
      - ${STREAMLY_STORAGE_ROOT:-./volumes/storage}:/storage:ro
      - media_scratch:/scratch:ro
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    mem_limit: 256m
    cpus: 0.2
    pids_limit: 16
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.path.getmtime('/tmp/analytics-heartbeat') < 900"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 180s
