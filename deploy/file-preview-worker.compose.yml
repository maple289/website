services:
  file-preview-worker:
    image: ${FILE_PREVIEW_WORKER_IMAGE:-supabase-file-preview-worker}
    build:
      context: ${STREAMLY_PROJECT_ROOT:?Set the absolute project checkout path}/services/file-preview-worker
    restart: unless-stopped
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    read_only: true
    tmpfs:
      - /work:size=384m,mode=1777
      - /tmp:size=64m,mode=1777
    mem_limit: 2g
    cpus: 1
    pids_limit: 128
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, KILL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.path.getmtime('/tmp/preview-heartbeat') < 60"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
