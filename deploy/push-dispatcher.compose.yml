services:
  push-dispatcher:
    image: ${PUSH_DISPATCHER_IMAGE:-supabase-push-dispatcher}
    build:
      context: ${STREAMLY_PROJECT_ROOT:?Set the absolute project checkout path}/services/push-dispatcher
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 32
    volumes:
      - push_keys:/var/lib/push
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-https://myhostage.ca}
    healthcheck:
      test: [CMD, python, -c, "import os,time; assert time.time()-os.path.getmtime('/tmp/push-heartbeat') < 180"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
volumes:
  push_keys:
