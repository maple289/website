name: streamly

services:
  web:
    image: ${STREAMLY_IMAGE:-streamly-web:local}
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    restart: unless-stopped
    environment:
      APP_ADDRESS: ${APP_ADDRESS:-:80}
      SUPABASE_API_UPSTREAM: ${SUPABASE_API_UPSTREAM:-host.docker.internal:8000}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
      - ${HTTPS_PORT:-443}:443/udp
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
